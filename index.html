<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QR Pay">
  <title>QR Pagamento</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; height: 100dvh; background: #000; }

    .screen { display: none; height: 100dvh; width: 100%; flex-direction: column; }
    .screen.active { display: flex; }

    /* ── Scanner ── */
    #scanner-screen { position: relative; background: #000; align-items: center; justify-content: center; }
    #reader { width: 100%; height: 100%; }
    #reader video { object-fit: cover; width: 100% !important; height: 100dvh !important; }
    #reader img { display: none !important; }
    #reader * { border: none !important; }
    .scanner-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: none;
    }
    .scanner-box {
      width: 220px; height: 220px;
      border: 3px solid rgba(255,255,255,0.85);
      border-radius: 20px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
    }
    .scanner-label {
      margin-top: 24px;
      color: white; font-size: 16px; font-weight: 500;
      background: rgba(0,0,0,0.5);
      padding: 8px 20px; border-radius: 20px;
    }

    /* ── Input ── */
    #input-screen {
      background: #fff;
      align-items: center; justify-content: center;
      padding: 40px 32px; gap: 18px;
    }
    .qr-icon { font-size: 56px; }
    #input-screen h1 { font-size: 24px; font-weight: 600; color: #111; }
    #input-screen p  { font-size: 15px; color: #888; }
    #amount-input {
      width: 100%; padding: 14px 18px;
      font-size: 22px; font-weight: 500; text-align: center;
      border: 1.5px solid #ddd; border-radius: 12px;
      outline: none; color: #111;
      -webkit-appearance: none;
    }
    #amount-input:focus { border-color: #3ba653; }
    #ok-btn {
      width: 100%; padding: 16px;
      background: #3ba653; color: white;
      font-size: 18px; font-weight: 600;
      border: none; border-radius: 14px;
      cursor: pointer; transition: opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    #ok-btn:disabled { background: #ccc; }
    #ok-btn:active { opacity: 0.85; }

    /* ── Confirmation ── */
    #confirm-screen { background: #3ba653; }
    .confirm-top {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; padding: 40px 32px 24px;
    }
    .confirm-check { font-size: 72px; color: white; line-height: 1; }
    .confirm-title {
      font-size: 20px; font-weight: 500;
      color: white; text-align: center; line-height: 1.4;
    }
    .confirm-card {
      margin: 0 14px;
      background: white; border-radius: 16px; overflow: hidden;
    }
    .card-row { padding: 16px 22px; }
    .card-row + .card-row { border-top: 0.5px solid #e8e8e8; }
    .card-label { font-size: 12px; color: #999; margin-bottom: 6px; }
    .card-value { font-size: 30px; font-weight: 400; color: #111; text-align: center; }
    .card-value-sm { font-size: 16px; color: #111; text-align: center; }
    .card-value-sm span { font-weight: 700; }
    .confirm-close {
      margin: 12px 14px 40px;
      background: white; border: none;
      border-radius: 14px; width: calc(100% - 28px);
      padding: 16px; font-size: 17px; font-weight: 500;
      color: #111; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .confirm-close:active { opacity: 0.7; }
  </style>
</head>
<body>

  <!-- Screen 1: Scanner -->
  <div id="scanner-screen" class="screen active">
    <div id="reader"></div>
    <div class="scanner-overlay">
      <div class="scanner-box"></div>
      <div class="scanner-label">Scansiona un QR Code</div>
    </div>
  </div>

  <!-- Screen 2: Input -->
  <div id="input-screen" class="screen">
    <div class="qr-icon">&#x2713;</div>
    <h1>QR Code scansionato!</h1>
    <p>Inserisci l'importo</p>
    <input id="amount-input" type="number" inputmode="decimal" placeholder="Es. 10.50" min="0" step="0.01">
    <button id="ok-btn" disabled onclick="handleOK()">OK</button>
  </div>

  <!-- Screen 3: Confirmation -->
  <div id="confirm-screen" class="screen">
    <div class="confirm-top">
      <div class="confirm-check">&#x2713;</div>
      <div class="confirm-title">Pagamento effettuato<br>con successo</div>
    </div>
    <div class="confirm-card">
      <div class="card-row">
        <div class="card-label">Importo</div>
        <div class="card-value" id="display-amount">CHF 0.00</div>
      </div>
      <div class="card-row">
        <div class="card-label">Data / Ora</div>
        <div class="card-value-sm" id="display-datetime"></div>
      </div>
    </div>
    <button class="confirm-close" onclick="resetApp()">Chiudi</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    let scanner = null;

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function startScanner() {
      scanner = new Html5Qrcode("reader");
      scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 }, aspectRatio: window.innerHeight / window.innerWidth },
        (decodedText) => {
          scanner.stop().then(() => {
            scanner = null;
            showScreen('input-screen');
            document.getElementById('amount-input').focus();
          });
        },
        () => {}
      ).catch(err => console.warn(err));
    }

    const input = document.getElementById('amount-input');
    const btn   = document.getElementById('ok-btn');
    input.addEventListener('input', () => {
      btn.disabled = input.value.trim() === '';
    });

    function formatCHF(val) {
      const n = parseFloat(val.replace(',', '.'));
      if (isNaN(n)) return 'CHF ' + val;
      return 'CHF ' + n.toFixed(2);
    }

    function formatDateTime(date) {
      const months = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
      const d = date.getDate();
      const m = months[date.getMonth()];
      const y = date.getFullYear();
      const hh = String(date.getHours()).padStart(2,'0');
      const mm = String(date.getMinutes()).padStart(2,'0');
      return `${d} ${m} ${y} | <span>${hh}:${mm}</span>`;
    }

    function handleOK() {
      const val = input.value.trim();
      if (!val) return;
      const now = new Date();
      document.getElementById('display-amount').textContent = formatCHF(val);
      document.getElementById('display-datetime').innerHTML = formatDateTime(now);
      showScreen('confirm-screen');
    }

    function resetApp() {
      input.value = '';
      btn.disabled = true;
      showScreen('scanner-screen');
      startScanner();
    }

    startScanner();
  </script>
</body>
</html>
