<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QR Reader">
  <title>Lettore QR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; height: 100dvh; background: #000; overflow: hidden; }
    .screen { display: none; height: 100dvh; width: 100%; flex-direction: column; }
    .screen.active { display: flex; }

    /* Scanner */
    #scanner-screen { position: relative; align-items: center; justify-content: center; }
    #reader { position: absolute; inset: 0; }
    #reader video { object-fit: cover; width: 100% !important; height: 100% !important; }
    #reader img { display: none !important; }
    #reader * { border: none !important; }
    .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
    .box { width: 220px; height: 220px; border: 3px solid rgba(255,255,255,.85); border-radius: 20px; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); }
    .label { margin-top: 24px; color: #fff; font-size: 16px; background: rgba(0,0,0,.5); padding: 8px 20px; border-radius: 20px; }
    .error { position: absolute; bottom: 40px; left: 20px; right: 20px; color: #fff; font-size: 14px; text-align: center; background: rgba(200,40,40,.9); padding: 12px 16px; border-radius: 12px; display: none; }
    .error.show { display: block; }

    /* Result */
    #result-screen { background: #f2f3f5; padding: 48px 16px 32px; gap: 14px; overflow-y: auto; }
    .tag { align-self: center; font-size: 13px; font-weight: 600; color: #fff; background: #4a5568; padding: 6px 14px; border-radius: 999px; }
    h1 { font-size: 22px; color: #111; text-align: center; }
    .card { background: #fff; border-radius: 14px; overflow: hidden; }
    .row { padding: 14px 18px; }
    .row + .row { border-top: 1px solid #eee; }
    .k { font-size: 12px; color: #888; margin-bottom: 4px; }
    .v { font-size: 16px; color: #111; word-break: break-all; }
    pre.v { font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap; }
    .note { font-size: 13px; color: #666; text-align: center; }
    button { width: 100%; padding: 16px; font-size: 17px; font-weight: 600; border: none; border-radius: 14px; background: #2b6cb0; color: #fff; -webkit-tap-highlight-color: transparent; }
    button:active { opacity: .85; }
  </style>
</head>
<body>
  <div id="scanner-screen" class="screen active">
    <div id="reader"></div>
    <div class="overlay">
      <div class="box"></div>
      <div class="label">Inquadra un QR Code</div>
    </div>
    <div class="error" id="scanner-error">Fotocamera non disponibile. Tocca per riprovare.</div>
  </div>

  <div id="result-screen" class="screen">
    <div class="tag" id="type-tag">QR</div>
    <h1>Contenuto del QR Code</h1>
    <div class="card" id="fields"></div>
    <p class="note">Solo lettura — nessun pagamento viene eseguito.</p>
    <button onclick="scanAgain()">Scansiona di nuovo</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    const scanner = new Html5Qrcode("reader");
    let busy = false;      // true while start/stop is in progress or a result is shown
    let aspect = null;     // computed once, before any keyboard/layout changes

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
    const errEl = document.getElementById('scanner-error');
    errEl.addEventListener('click', () => { busy = false; startScanner(); });

    function isRunning() {
      try { return scanner.getState() === 2 || scanner.getState() === 3; } // 2 = SCANNING, 3 = PAUSED
      catch (e) { return false; }
    }

    async function startScanner() {
      if (isRunning()) return;
      errEl.classList.remove('show');
      if (!aspect) aspect = window.innerHeight / window.innerWidth;
      try {
        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 220, height: 220 }, aspectRatio: aspect },
          onScan,
          () => {}
        );
        busy = false;
      } catch (e) {
        console.warn('start failed', e);
        errEl.classList.add('show');
      }
    }

    async function onScan(text) {
      // The success callback can fire several times in a row before the
      // camera stops; ignore everything after the first hit.
      if (busy) return;
      busy = true;
      try { await scanner.stop(); } catch (e) { console.warn('stop failed', e); }
      try { scanner.clear(); } catch (e) {}
      showResult(text);
    }

    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function row(k, v, mono) {
      return `<div class="row"><div class="k">${esc(k)}</div><${mono ? 'pre' : 'div'} class="v">${esc(v)}</${mono ? 'pre' : 'div'}></div>`;
    }

    function showResult(text) {
      const tag = document.getElementById('type-tag');
      let html = '';
      const lines = text.split(/\r?\n/);

      if (lines[0] === 'SPC') {
        // Swiss QR-bill (used by banks and TWINT for invoices)
        tag.textContent = 'QR-fattura svizzera';
        const amt = lines[18] ? `${lines[19] || ''} ${lines[18]}` : 'non specificato';
        html += row('Beneficiario', lines[5] || '—');
        html += row('IBAN', lines[3] || '—');
        html += row('Località', [lines[8], lines[9], lines[10]].filter(Boolean).join(' ') || '—');
        html += row('Importo', amt);
        if (lines[28]) html += row('Riferimento', lines[28]);
        if (lines[29]) html += row('Messaggio', lines[29]);
      } else if (/twint/i.test(text)) {
        tag.textContent = 'TWINT';
        html += row('Tipo', 'Codice TWINT (link/token)');
        try { const u = new URL(text); html += row('Dominio', u.host); } catch (e) {}
      } else if (/^https?:\/\//i.test(text)) {
        tag.textContent = 'Link';
      } else {
        tag.textContent = 'Testo';
      }
      html += row('Contenuto grezzo', text, true);
      document.getElementById('fields').innerHTML = html;
      showScreen('result-screen');
    }

    function scanAgain() {
      showScreen('scanner-screen');
      // Give iOS Safari time to release the previous camera track.
      setTimeout(() => { busy = false; startScanner(); }, 400);
    }

    startScanner();
  </script>
</body>
</html>
